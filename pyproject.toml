[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "egis-agentkit-mock"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "mcp>=2.3,<3",
    "PyJWT[crypto]>=2.10",
    "uvicorn>=0.30",
]

[project.scripts]
agentkit-mock-mcp = "egis_agentkit_mock.mcp.cli:main"

[dependency-groups]
dev = ["httpx>=0.28", "pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/egis_agentkit_mock"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
